name: Release APK and AAB

# Manual build of a release APK (for sharing) and AAB (for Google Play).
# Uses your own key if the four secrets below exist; otherwise the bundled test key.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip app.zip
        run: |
          test -f app.zip || { echo "app.zip not found in the repo root"; exit 1; }
          rm -rf _project && mkdir _project
          unzip -q app.zip -d _project
          SETTINGS=$(find _project -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          test -n "$SETTINGS" || { echo "settings.gradle.kts not found inside app.zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        timeout-minutes: 3
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Use your release key (only if the secrets exist)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with YOUR release key."
          else
            echo "No release secrets found: signing with the bundled test key."
          fi

      - name: Build release APK and AAB
        timeout-minutes: 25
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          gradle assembleRelease bundleRelease --no-daemon --console=plain --stacktrace > build.log 2>&1
          STATUS=$?
          echo "Gradle exit code: $STATUS"
          if [ $STATUS -ne 0 ]; then
            echo "=============== KOTLIN / COMPILE ERRORS ==============="
            grep -n "^e: " build.log | head -40
            echo "=============== WHAT WENT WRONG ==============="
            grep -n -A8 "What went wrong" build.log | head -40
            echo "=============== LAST 30 LINES ==============="
            tail -n 30 build.log
          fi
          exit $STATUS

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamicStudiesAcademy-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB (for Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: IslamicStudiesAcademy-release-aab
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore
