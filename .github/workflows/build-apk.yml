name: Build APK

on:
  push:
    paths:
      - "app.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip app.zip
        run: |
          test -f app.zip || { echo "app.zip not found in the repo root"; exit 1; }
          rm -rf _project && mkdir _project
          unzip -q app.zip -d _project
          SETTINGS=$(find _project -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          test -n "$SETTINGS" || { echo "settings.gradle.kts not found inside app.zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        timeout-minutes: 3
        continue-on-error: true
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Show Android SDK
        continue-on-error: true
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        timeout-minutes: 25
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain --stacktrace > build.log 2>&1
          STATUS=$?
          echo "Gradle exit code: $STATUS"
          if [ $STATUS -ne 0 ]; then
            echo "=============== KOTLIN / COMPILE ERRORS ==============="
            grep -n "^e: " build.log | head -40
            echo "=============== WHAT WENT WRONG ==============="
            grep -n -A8 "What went wrong" build.log | head -40
            echo "=============== LAST 30 LINES ==============="
            tail -n 30 build.log
          fi
          exit $STATUS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamicStudiesAcademy-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
